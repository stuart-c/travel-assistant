name: Test Backend

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: travel-assistant/app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r travel-assistant/app/requirements.txt
          pip install -r travel-assistant/app/requirements_test.txt

      - name: Run linting (black)
        run: black --check travel-assistant/app

      - name: Run linting (ruff)
        run: ruff check travel-assistant/app

      - name: Run unit tests (pytest)
        env:
          PYTHONPATH: ${{ github.workspace }}/travel-assistant
        run: |
          pytest travel-assistant/app/tests \
            --cov=travel-assistant/app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-coverage
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
